# Nombre lógico de la aplicación Spring Boot.
spring.application.name=IncidenciasAPI

# Servidor HTTP donde se publica la API.
server.port=8080

#Configuración de la base de datos (MySQL/MariaDB en localhost:3307, como en clase).
# createDatabaseIfNotExist crea el esquema "incidencias" la primera vez y Hibernate
# (ddl-auto=update) genera automáticamente las tablas a partir de las entidades.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/incidencias?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuración de JPA
# Crea o actualiza el esquema sin borrar los datos existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Los DTO se montan dentro de la transacción del servicio, así que no se necesita
# la sesión abierta durante la vista (y se evita el aviso de Spring Boot).
spring.jpa.open-in-view=false

#Para ver las SQL que se ejecutan poner las siguientes (opcional)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

#Configuración del token JWT.
# La clave se lee de una propiedad (y se puede sobrescribir con la variable de entorno JWT_SECRET).
# Debe tener al menos 32 bytes para poder firmar con HS256. Al mantener la misma clave entre
# reinicios, los tokens emitidos siguen siendo válidos después de reiniciar la aplicación.
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-incidencias-cambiame-en-produccion-2026}
# Caducidad del token en milisegundos (2 horas por defecto).
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
# Emisor que se incluye en el token y se valida al decodificarlo.
app.jwt.issuer=App-Incidencias
